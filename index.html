<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Panel</title>
  <!-- HLS Yayın Destek Kütüphanesi -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0e12;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 15px 30px;
      background: #16181e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #252830;
    }
    h1 { font-size: 22px; letter-spacing: 1px; color: #e50914; }
    
    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
    }
    
    /* Sol Kanal Listesi (Kumanda ile Kolay Seçim) */
    .sidebar {
      width: 320px;
      background: #12141a;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      border-right: 2px solid #252830;
    }
    
    .channel-btn {
      background: #1c1f26;
      color: #fff;
      border: 2px solid #2a2e3d;
      padding: 16px 20px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      outline: none;
    }

    /* LG TV Kumanda Odaklanma (Focus) Efekti */
    .channel-btn:focus, .channel-btn:hover {
      background: #e50914;
      border-color: #ffffff;
      transform: scale(1.03);
      box-shadow: 0 0 15px rgba(229, 9, 20, 0.6);
    }

    /* Sağ Video Ekranı */
    .player-box {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <header>
    <h1>CANLI TV</h1>
    <span id="current-channel" style="color: #aaa; font-weight: 500;">Kanal Seçiniz</span>
  </header>

  <div class="container">
    <!-- Kanal Butonları -->
    <div class="sidebar">
      <button class="channel-btn" tabindex="1" onclick="playStream('https://atv.mncdn.com/atv/live/playlist.m3u8', 'ATV')">ATV</button>
      <button class="channel-btn" tabindex="2" onclick="playStream('https://showtv.mncdn.com/showtv/live/playlist.m3u8', 'SHOW TV')">SHOW TV</button>
      <button class="channel-btn" tabindex="3" onclick="playStream('https://startv.mncdn.com/startv/live/playlist.m3u8', 'STAR TV')">STAR TV</button>
      <button class="channel-btn" tabindex="4" onclick="playStream('https://live.kanald.com.tr/kanald/live/playlist.m3u8', 'KANAL D')">KANAL D</button>
      <button class="channel-btn" tabindex="5" onclick="playStream('https://foxtv.mncdn.com/foxtv/live/playlist.m3u8', 'NOW')">NOW</button>
      <button class="channel-btn" tabindex="6" onclick="playStream('https://tv8.mncdn.com/tv8/live/playlist.m3u8', 'TV8')">TV8</button>
      <button class="channel-btn" tabindex="7" onclick="playStream('https://tv-trt1.medya.trt.com.tr/master.m3u8', 'TRT 1')">TRT 1</button>
      <button class="channel-btn" tabindex="8" onclick="playStream('https://haberturk.mncdn.com/haberturk/live/playlist.m3u8', 'HABERTÜRK')">HABERTÜRK</button>
    </div>

    <!-- Oynatıcı -->
    <div class="player-box">
      <video id="video" controls autoplay></video>
    </div>
  </div>

  <script>
    var video = document.getElementById('video');
    var hls;

    function playStream(url, name) {
      document.getElementById('current-channel').innerText = 'Şu an izleniyor: ' + name;
      
      if (Hls.isSupported()) {
        if (hls) { hls.destroy(); }
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      }
    }
  </script>
</body>
</html>
